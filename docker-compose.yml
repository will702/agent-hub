services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: agenthub
      POSTGRES_DB: agenthub
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - agent_hub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub"]
      interval: 5s
      retries: 10
volumes:
  agent_hub_pg:
